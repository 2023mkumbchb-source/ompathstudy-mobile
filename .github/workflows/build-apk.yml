name: Build Android APK

on:
  push:
    branches: [ main, android-apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install Exact Node Dependencies
        run: npm ci --legacy-peer-deps
      - name: Test Mobile Application
        run: npm test
      - name: Refresh Complete Offline Content Seed
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node scripts/generate-offline-seed.mjs; then exit 0; fi
            echo "Supabase seed refresh attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "::warning::Supabase seed refresh failed after 3 attempts; using the last verified packaged seed."
      - name: Build Web Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://dekyjrfwvavtoivqivno.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_jOXeiFMWJj1z_M-zShimXA_cG9f2QxL' }}
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Package Silent OTA Web Bundle
        run: |
          cd dist
          zip -r ../OmpathStudy-web-bundle.zip .
      - name: Make Gradle Executable
        run: chmod +x android/gradlew
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Read Android version
        shell: bash
        run: |
          VERSION_NAME=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | head -1 | sed 's/versionName "//;s/"//')
          VERSION_CODE=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | head -1 | awk '{print $2}')
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
      - name: Name installable APK files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Ompath-v${VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk OmpathStudy.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmpathStudy-Android-APK-v${{ env.VERSION_NAME }}
          path: |
            Ompath-v${{ env.VERSION_NAME }}.apk
            OmpathStudy.apk
          retention-days: 30
      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/android-apk'
        with:
          tag_name: v${{ env.VERSION_NAME }}-apk
          name: Ompath Mobile v${{ env.VERSION_NAME }}
          body: |
            ## Ompath Android Native App v${{ env.VERSION_NAME }}
            - Android versionCode ${{ env.VERSION_CODE }} and versionName ${{ env.VERSION_NAME }}
            - Route-aware SEO canonical and robots handling
            - Public/private indexing separation and duplicate query canonicalization
            - Dynamic sitemap infrastructure retained
            - Stale chunk/cache recovery retained
            - Reveal requires an active paid subscription when configured as paid
            - Logged-out users cannot retain a cached subscription to reveal answers
            - Signing in refreshes the account-linked subscription automatically
            - Admin can set Reveal price to 0 to make Reveal free
            - Publishes the installable APK and OTA web bundle
            - Also publishes OmpathStudy.apk as the stable download asset used by the website
          files: |
            Ompath-v${{ env.VERSION_NAME }}.apk
            OmpathStudy.apk
            OmpathStudy-web-bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
