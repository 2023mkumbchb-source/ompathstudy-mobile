name: Build Android APK

on:
  push:
    branches: [ main, android-apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Exact Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: Test Mobile Application
        run: npm test

      - name: Build Web Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://dekyjrfwvavtoivqivno.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_jOXeiFMWJj1z_M-zShimXA_cG9f2QxL' }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Package Silent OTA Web Bundle
        run: |
          cd dist
          zip -r ../OmpathStudy-web-bundle.zip .

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Name Installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OmpathStudy-v1.0.10.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmpathStudy-Android-APK
          path: OmpathStudy-v1.0.10.apk
          retention-days: 30

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/android-apk'
        with:
          tag_name: v1.0.10-apk
          name: Ompath Study Mobile v1.0.10
          body: |
            ## Ompath Study Android Native App v1.0.10
            - Dedicated mobile layout with bottom navigation bar
            - Live unread notification counter badge
            - Dedicated Student Notification Center (`/notifications`)
            - Full Admin Broadcast Studio with View, Edit, and Delete controls (`/admin/notifications`)
            - Mobile Push, WhatsApp-style banners, and Chime sound toggles
            - Secure per-user Supabase Realtime notification delivery
            - Silent in-app OTA web bundle updates
            - Truly fixed header on every non-exam screen
            - Automatic complete offline post and image synchronization
            - Reliable authenticated notification publishing from mobile sessions
            - In-app Update Center with download progress and automatic restart
            - Offline Library dashboard with complete manual synchronization
            - Repaired mobile menu layering, scrolling and page links
            - Notification links stay inside the APK while email links open the website
            - Repaired Broadcast Studio and separated campaigns from personal app alerts
            - About page hidden by default and editable by administrators
            - Fixed Broadcast Studio runtime crash and hardened notification cache
            - Bottom navigation remains available on admin and recovery screens
            - Independent App notification and Email notification delivery switches
            - Responsive live phone preview and professional emoji-free notification format
          files: |
            OmpathStudy-v1.0.10.apk
            OmpathStudy-web-bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
